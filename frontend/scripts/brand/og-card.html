<!doctype html>
<html><head><meta charset="utf-8">
<!-- Rendering fetches IBM Plex Sans from Google Fonts, so it needs network access. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; color: #0E1116; background: #F5F5F1;
    font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
    border-top: 8px solid #1F3FE0; box-sizing: border-box;
  }
  .copy { position: absolute; left: 84px; top: 50%; transform: translateY(-50%); display: grid; gap: 28px; width: 620px; }
  .lockup { height: 64px; width: auto; justify-self: start; }
  h1 { margin: 0; font-weight: 600; font-size: 64px; line-height: 1.06; letter-spacing: -0.02em; }
  p { margin: 0; font-weight: 400; font-size: 24px; line-height: 1.3; color: #3F4752; }
  .rule { width: 72px; height: 2px; background: #1F3FE0; }
  .object { position: absolute; right: 80px; top: 50%; transform: translateY(-50%); width: 300px; height: 300px; object-fit: contain; }
</style></head>
<body>
  <div class="copy">
    <img class="lockup" src="../../public/brand/atlas-lockup.svg" alt="">
    <h1>Brief me on any place or policy.</h1>
    <div class="rule"></div>
    <p>What changed, where, and what to read next.</p>
  </div>
  <img class="object" src="../../public/brand/atlas-mark.svg" alt="">
</body></html>
